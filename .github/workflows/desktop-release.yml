name: Build desktop releases

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} installers
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundles: msi,nsis
            artifact_path: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos
            os: macos-latest
            bundles: dmg
            artifact_path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run tauri:build -- --bundles ${{ matrix.bundles }} ${{ matrix.platform == 'macos' && '--target universal-apple-darwin' || '' }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-installers
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Collect installer files
        shell: bash
        run: |
          mkdir release-files
          find release-assets -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) \
            -exec cp {} release-files/ \;
          installer_count="$(find release-files -maxdepth 1 -type f | wc -l)"
          if [ "$installer_count" -ne 3 ]; then
            echo "Expected 2 Windows installers and 1 macOS DMG, found $installer_count."
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Batchlogg Desktop ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: release-files/*
