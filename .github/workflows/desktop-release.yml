name: Build desktop releases

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} installers
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundles: msi,nsis
            artifact_path: |
              src-tauri/target/release/bundle/msi/*
              src-tauri/target/release/bundle/nsis/*
          - platform: macos
            os: macos-latest
            bundles: app,dmg
            artifact_path: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Verify updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY repository secret before publishing desktop releases."
            exit 1
          fi

      - name: Build installers
        run: npm run tauri:build -- --bundles ${{ matrix.bundles }} ${{ matrix.platform == 'macos' && '--target universal-apple-darwin' || '' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-installers
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Collect installers and build update manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-files

          msi="$(find release-assets -type f -name '*.msi' -print -quit)"
          nsis="$(find release-assets -type f -name '*.exe' -print -quit)"
          dmg="$(find release-assets -type f -name '*.dmg' -print -quit)"
          mac_update="$(find release-assets -type f -name '*.app.tar.gz' -print -quit)"

          require_file() {
            if [ -z "$1" ] || [ ! -f "$1" ]; then
              echo "::error::Missing expected artifact: $2"
              exit 1
            fi
          }
          require_file "$msi" "Windows MSI installer"
          require_file "$msi.sig" "Windows MSI update signature"
          require_file "$nsis" "Windows NSIS installer"
          require_file "$nsis.sig" "Windows NSIS update signature"
          require_file "$dmg" "macOS DMG installer"
          require_file "$mac_update" "macOS app.tar.gz updater bundle"
          require_file "$mac_update.sig" "macOS updater signature"

          cp "$msi" release-files/windows-x86_64-msi.msi
          cp "$msi.sig" release-files/windows-x86_64-msi.msi.sig
          cp "$nsis" release-files/windows-x86_64-nsis.exe
          cp "$nsis.sig" release-files/windows-x86_64-nsis.exe.sig
          cp "$dmg" release-files/Batchlogg-macos-universal.dmg
          cp "$mac_update" release-files/darwin-universal.app.tar.gz
          cp "$mac_update.sig" release-files/darwin-universal.app.tar.gz.sig

          version="${GITHUB_REF_NAME#desktop-v}"
          tag_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          pub_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg version "$version" \
            --arg pub_date "$pub_date" \
            --arg notes "Install this update to get the latest Batchlogg improvements." \
            --arg nsis_url "$tag_url/windows-x86_64-nsis.exe" \
            --arg nsis_sig "$(cat release-files/windows-x86_64-nsis.exe.sig)" \
            --arg msi_url "$tag_url/windows-x86_64-msi.msi" \
            --arg msi_sig "$(cat release-files/windows-x86_64-msi.msi.sig)" \
            --arg mac_url "$tag_url/darwin-universal.app.tar.gz" \
            --arg mac_sig "$(cat release-files/darwin-universal.app.tar.gz.sig)" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64-nsis": { url: $nsis_url, signature: $nsis_sig },
                "windows-x86_64-msi": { url: $msi_url, signature: $msi_sig },
                "darwin-x86_64": { url: $mac_url, signature: $mac_sig },
                "darwin-aarch64": { url: $mac_url, signature: $mac_sig }
              }
            }' > release-files/latest.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Batchlogg Desktop ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: release-files/*
